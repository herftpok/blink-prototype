<!doctype html>
<html lang="ru"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101014"><link rel="preload" as="image" href="../../assets/brand/logo.png"><title>Где я был · Blink</title><link rel="stylesheet" href="../../styles/tokens.css"><link rel="stylesheet" href="../../styles/base.css"><link rel="stylesheet" href="../../styles/components.css"><link rel="stylesheet" href="tracks.css?v=calendar1"></head>
<body><a class="compare-link" href="compare.html?v=calendar1">Сравнить три варианта ↗</a><div class="device"><div class="app" id="phone">
<div class="status-bar" aria-hidden="true"><img class="status-bar__time" src="../../assets/system/status-time.png" alt=""><img class="status-bar__island" src="../../assets/system/live-activity.png" alt=""><img class="status-bar__icons" src="../../assets/system/status-icons.png" alt=""></div>
<main id="screen" aria-label="Карта маршрута">
  <canvas id="map" width="780" height="1688" aria-label="Маршрут за день"></canvas>
  <div class="map-credit"><span id="district"></span><details class="map-source"><summary aria-label="Источники карты">ⓘ</summary><small>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · OpenFreeMap</small></details></div>
  <div id="places"></div><div id="traveller"></div>
  <header class="map-header">
    <div class="map-nav">
      <a class="map-tool" href="../../index.html#/map" aria-label="На карту Blink"><img src="../../assets/icons/back.png" alt=""></a>
      <nav class="date" aria-label="Выбор дня">
        <button id="older" aria-label="Предыдущий день"></button>
        <span id="date" aria-live="polite"></span>
        <button id="newer" aria-label="Следующий день"></button>
      </nav>
      <button id="share" class="map-tool" aria-label="Поделиться маршрутом"><img src="../../assets/icons/share.png" alt=""></button>
    </div>
    <div class="route-heading"><h1>где я был</h1><button id="privacy-open" class="map-tool" aria-label="Настройки приватности" title="Приватность"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 20 6v5c0 5.1-3.3 8-8 10-4.7-2-8-4.9-8-10V6l8-3Z" stroke="currentColor" stroke-width="2"/><path d="M9 11.6l2.1 2.2 4-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div id="summary"></div>
  </header>
  <div id="place-info" hidden>
    <button id="dismiss-info" aria-label="Закрыть подробности">×</button>
    <strong id="place-name"></strong><div id="visit"></div><small id="trip"></small>
    <button id="edit" hidden></button>
  </div>
  <div class="playback">
    <button id="play" aria-label="Воспроизвести маршрут"></button>
    <button id="clock" aria-expanded="false" aria-controls="time-picker"><b id="current"></b></button>
    <div id="time-picker" hidden><div id="time-range"></div><input id="seek" aria-label="Положение на маршруте" type="range" min="0" max="1000"></div>
  </div>
</main><div class="tracks-backdrop" id="scrim" hidden></div>
<dialog id="zone"><form id="form"><div class="handle"></div><button class="close" type="button" aria-label="Закрыть">×</button><h2>своё место</h2><p id="visits"></p><label for="name">название</label><input id="name" required maxlength="36" autocomplete="off"><label>иконка на карте</label><div id="icons"></div><button class="primary">сохранить место</button></form></dialog>
<dialog id="privacy" class="sheet" aria-modal="true" aria-labelledby="privacy-title" aria-describedby="privacy-description" tabindex="-1">
  <div class="sheet__handle" id="privacy-handle">
    <div class="sheet__grabber"></div>
    <div class="privacy-heading"><h2 id="privacy-title">заглушить день</h2><img src="../../assets/stickers/eyes.webp" width="56" height="56" alt=""></div>
  </div>
  <form id="privacy-form" autocomplete="off">
    <div class="calendar-nav">
      <label class="calendar-select"><select id="cal-month" aria-label="Месяц"></select></label>
      <label class="calendar-select"><select id="cal-year" aria-label="Год"></select></label>
      <div class="calendar-arrows">
        <button id="cal-prev" type="button" aria-label="Предыдущий месяц с маршрутами">‹</button>
        <button id="cal-next" type="button" aria-label="Следующий месяц с маршрутами">›</button>
      </div>
    </div>
    <div class="calendar-week" aria-hidden="true"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
    <div id="privacy-days" role="radiogroup" aria-label="День маршрута"></div>
    <p id="privacy-description" class="sheet__text">Часть пути за выбранный день будет выглядеть как потеря сигнала. Вернуть исходный маршрут не получится.</p>
    <button class="button button--primary pressable" id="privacy-next" disabled>выбери день</button>
    <p id="privacy-error" role="alert"></p>
  </form>
</dialog>
<dialog id="story" aria-labelledby="story-title">
  <div class="handle"></div><button class="close" aria-label="Закрыть">×</button>
  <h2 id="story-title">поделиться маршрутом</h2>
  <p class="story-meta">Видео · 12 секунд</p>
  <canvas id="preview" width="780" height="1688" aria-label="Предпросмотр видео маршрута"></canvas>
  <button id="export" class="primary">сохранить видео</button><p id="status" role="status"></p>
</dialog>
<div class="home-indicator"></div></div></div><script src="../../scripts/pin.js"></script><script src="data.js?v=calendar1"></script><script type="module" src="tracks.js?v=calendar1"></script></body></html>
