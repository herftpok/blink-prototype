<!doctype html>
<html lang="ru"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101014"><link rel="preload" as="image" href="../../assets/brand/logo.png"><title>Где я был · Blink</title><link rel="stylesheet" href="../onboarding-school/font.css"><link rel="stylesheet" href="../../styles/tokens.css"><link rel="stylesheet" href="../../styles/base.css"><link rel="stylesheet" href="../../styles/components.css"><link rel="stylesheet" href="../../styles/screens/map.css"><link rel="stylesheet" href="tracks.css?v=blink6"></head>
<body><nav id="layout-review" aria-label="Размещение действий" hidden>
  <button type="button" data-layout="heading">Под заголовком</button>
  <button type="button" data-layout="rail">У шкалы</button>
  <button type="button" data-layout="menu">В меню</button>
</nav>
<aside id="stats-review" aria-label="Варианты итогов дня">
  <div class="stats-choice"><button type="button" data-stats="columns" aria-pressed="true">Колонки</button><dl class="day-stats" data-stats="columns" aria-hidden="true"></dl></div>
  <div class="stats-choice"><button type="button" data-stats="distance" aria-pressed="false">Акцент на пути</button><dl class="day-stats" data-stats="distance" aria-hidden="true"></dl></div>
  <div class="stats-choice"><button type="button" data-stats="rows" aria-pressed="false">Список</button><dl class="day-stats" data-stats="rows" aria-hidden="true"></dl></div>
  <div class="stats-choice"><button type="button" data-stats="chips" aria-pressed="false">Плашки карты</button><dl class="day-stats" data-stats="chips" aria-hidden="true"></dl></div>
  <div class="stats-choice"><button type="button" data-stats="profile" aria-pressed="false">Как в профиле</button><dl class="day-stats" data-stats="profile" aria-hidden="true"></dl></div>
</aside><div class="device"><div class="app" id="phone">
<div class="status-bar" aria-hidden="true"><img class="status-bar__time" src="../../assets/system/status-time.png" alt=""><img class="status-bar__island" src="../../assets/system/live-activity.png" alt=""><img class="status-bar__icons" src="../../assets/system/status-icons.png" alt=""></div>
<main id="screen" aria-label="Карта маршрута">
  <canvas id="map" width="780" height="1688" aria-label="Маршрут за день"></canvas>
  <div id="places"></div><div id="traveller">
    <div id="visit-context" hidden><strong id="visit-label"></strong><span id="visit-hours"></span></div>
  </div>
  <header class="map-header">
    <div class="route-heading"><h1>где я был</h1><a id="route-close" href="../../index.html#/map" aria-label="Закрыть маршрут"><img src="../../assets/icons/close.png" alt=""></a></div>
    <dl class="day-stats" id="summary" aria-label="Итоги дня"></dl>
    <div id="heading-actions"></div>
  </header>
  <div id="empty-day" hidden><strong>нет маршрута</strong><span>За этот день нет геоточек.</span></div>
  <div id="place-info" hidden>
    <button id="dismiss-info" aria-label="Закрыть подробности">×</button>
    <strong id="place-name"></strong><div id="visit"></div><small id="trip"></small>
    <button id="edit" hidden></button>
  </div>
  <div class="playback">
    <time id="current"></time>
    <div class="rail-controls"><button id="play" aria-label="Воспроизвести маршрут"></button>
      <div id="visit-rail" aria-label="Шкала маршрута">
        <div class="rail-window"><div id="visit-track"></div></div>
        <input id="seek" type="range" min="0" max="10000" aria-label="Положение на маршруте">
      </div>
    </div>
  </div>
  <div class="route-footer">
    <button id="date" type="button" aria-haspopup="dialog" aria-controls="privacy"><img src="../../assets/icons/calendar.png" alt=""><span></span></button>
    <div id="footer-actions">
      <button id="more-actions" type="button" aria-label="Действия с маршрутом" aria-haspopup="menu" aria-controls="route-actions" aria-expanded="false"><span aria-hidden="true">•••</span></button>
      <div id="route-actions">
        <button id="share" type="button" aria-label="Поделиться маршрутом"><img src="../../assets/icons/share.png" alt=""><span>Поделиться</span></button>
        <button id="privacy-open" type="button" aria-label="Настройки приватности"><img src="../../assets/icons/privacy.png" alt=""><span>Приватность</span></button>
      </div>
    </div>
  </div>
</main><div class="tracks-backdrop" id="scrim" hidden></div>
<dialog id="zone"><form id="form"><div class="handle"></div><button class="close" type="button" aria-label="Закрыть">×</button><h2>своё место</h2><p id="visits"></p><label for="name">название</label><input id="name" required maxlength="36" autocomplete="off"><label>иконка на карте</label><div id="icons"></div><button class="primary">сохранить место</button></form></dialog>
<dialog id="privacy" class="sheet" aria-modal="true" aria-labelledby="privacy-title" tabindex="-1">
  <div class="sheet__handle" id="privacy-handle">
    <div class="sheet__grabber"></div>
    <div class="privacy-heading"><h2 id="privacy-title">заглушить день</h2></div>
  </div>
  <form id="privacy-form" autocomplete="off">
    <div class="calendar-nav">
      <button type="button" id="cal-month" class="calendar-trigger" aria-controls="cal-periods" aria-expanded="false"></button>
      <button type="button" id="cal-year" class="calendar-trigger" aria-controls="cal-periods" aria-expanded="false"></button>
      <div class="calendar-arrows">
        <button id="cal-prev" type="button" aria-label="Предыдущий месяц с маршрутами">‹</button>
        <button id="cal-next" type="button" aria-label="Следующий месяц с маршрутами">›</button>
      </div>
    </div>
    <div id="cal-body">
    <div id="cal-periods" class="calendar-periods" role="group" hidden></div>
    <div class="calendar-week" aria-hidden="true"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
    <div id="privacy-days" role="radiogroup" aria-label="День маршрута"></div>
    </div>
    <button class="button button--primary pressable" id="privacy-next" disabled>выбери день</button>
  </form>
</dialog>
<dialog id="confirm-day" class="sheet" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-copy" tabindex="-1">
  <div class="sheet__handle"><div class="sheet__grabber"></div><div class="privacy-heading"><h2 id="confirm-title"></h2><img src="../../assets/stickers/block.webp" width="56" height="56" alt=""></div></div>
  <p id="confirm-copy" class="sheet__text">Твой путь за этот день будет искажен помехами, чтобы скрыть маршрут. Вернуть исходную версию уже не получится</p>
  <button type="button" id="confirm-apply" class="button button--primary pressable">заглушить день</button>
  <button type="button" id="confirm-cancel" class="button button--ghost pressable">отмена</button>
  <p id="privacy-error" role="alert"></p>
</dialog>
<dialog id="story" aria-labelledby="story-title">
  <div class="handle"></div><button class="close" aria-label="Закрыть">×</button>
  <h2 id="story-title">поделиться маршрутом</h2>
  <p class="story-meta" id="story-meta"></p>
  <canvas id="preview" width="780" height="1688" aria-label="Предпросмотр видео маршрута"></canvas>
  <button id="export" class="primary">сохранить видео</button><p id="status" role="status"></p>
</dialog>
<div class="home-indicator"></div></div></div><script src="../../scripts/pin.js"></script><script src="zone-art.js?v=office1"></script><script src="data.js?v=office1"></script><script type="module" src="tracks.js?v=blink6"></script></body></html>
