<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Blink – варианты заголовка раздела маркета</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,700&display=swap">
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/icons.css">
  <style>
    /* эскиз: шапка раздела «стикеры» в варианте «от Лёши» – четыре композиции над одной и той же сеткой */
    body { background: var(--color-bg); color: var(--color-text); }
    .hv { display: grid; grid-template-columns: repeat(3, 390px); gap: 40px; justify-content: center; padding: 40px 24px 60px; }
    .hv__head { grid-column: 1 / -1; text-align: center; font: var(--type-sheet-title); }
    .hv__label { color: var(--color-text-muted); font: var(--type-label); margin-bottom: 10px; }
    .hv__label b { color: var(--color-text); font-weight: inherit; }
    .hv__screen { width: 390px; padding: 0 0 8px; border-radius: 24px; background: var(--color-bg); outline: 1px solid var(--color-surface); overflow: hidden; }

    /* сетка – общая для всех вариантов */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 16px; }
    .cell { position: relative; aspect-ratio: 366 / 525; border-radius: 20px; background: #030303 url("../../assets/market-hub/item/sticker-cell.png") center / 100% 100% no-repeat; overflow: hidden; }
    .cell img.art { position: absolute; inset: 15% 4% 20%; width: 92%; height: 65%; object-fit: contain; }
    .cell .price { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 2px; font: italic 700 22px/1 var(--font-ui); -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
    .cell .price img { width: 22px; height: 22px; }
    .cell--all { display: grid; place-items: center; background-color: #000; }
    .cell--all b { font: italic 800 30px/1 var(--font-ui); }
    .cell--all span { position: absolute; left: 12px; bottom: 12px; font: 600 12px/14px var(--font-ui); }

    /* сейчас: заголовок 24/600, описание 13/600 серым в две строки во всю ширину */
    .now { padding: 24px 16px 16px; }
    .now b { display: block; font: 600 24px/29px var(--font-ui); }
    .now span { display: block; margin-top: 6px; color: var(--color-text-muted); font: var(--type-gift-note); }

    /* 1 – одна фраза в два веса: «стикеры» белым жирным, продолжение серым тем же кеглем */
    .v1 { padding: 24px 16px 16px; font: 600 20px/25px var(--font-ui); letter-spacing: -0.01em; text-wrap: balance; }
    .v1 span { color: var(--color-text-muted); }

    /* 2 – заголовок крупно и плотно, описание узкой колонкой в две ровные строки */
    .v2 { padding: 26px 16px 16px; }
    .v2 b { display: block; font: 700 30px/32px var(--font-ui); letter-spacing: -0.03em; }
    .v2 span { display: block; max-width: 230px; margin-top: 6px; color: var(--color-text-muted); font: 500 14px/18px var(--font-ui); text-wrap: balance; }

    /* 3 – заголовок слева, описание справа мелко, по базовой линии (журнальная пара) */
    .v3 { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 24px 16px 16px; }
    .v3 b { flex: none; font: 700 30px/30px var(--font-ui); letter-spacing: -0.03em; }
    .v3 span { max-width: 170px; color: var(--color-text-muted); font: 500 12px/15px var(--font-ui); text-align: right; text-wrap: balance; }

    /* 4 – надзаголовок: описание капсом мелко над заголовком, заголовок крупно */
    .v4 { padding: 24px 16px 16px; }
    .v4 span { display: block; max-width: 300px; color: var(--color-text-muted); font: 600 11px/14px var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; }
    .v4 b { display: block; margin-top: 4px; font: 700 30px/32px var(--font-ui); letter-spacing: -0.03em; }

    /* 5 – заголовок курсивом, как цены в ячейках, описание короткой строкой */
    .v5 { padding: 24px 16px 16px; }
    .v5 b { display: block; font: italic 800 28px/30px var(--font-ui); letter-spacing: -0.02em; }
    .v5 span { display: block; margin-top: 4px; color: var(--color-text-muted); font: 500 14px/18px var(--font-ui); }
  </style>
</head>
<body>
  <main class="hv">
    <h1 class="hv__head">шапка раздела – варианты</h1>
  </main>
  <script>
    const A = "../../assets", L = `${A}/market-hub/item`;
    const cells = ["nsc-serious", "nsc-eggs", "nsc-tears", "nsc-croc", "nsc-glitter"].map((n) =>
      `<div class="cell"><img class="art" src="${L}/${n}.webp" alt=""><span class="price"><img src="${A}/market-hub/lesha/coin.svg" alt="">10</span></div>`).join("");
    const grid = (all = true) => `<div class="grid">${cells}${all ? '<div class="cell cell--all"><b>20</b><span>все<br>стикеры</span></div>' : `<div class="cell"><img class="art" src="${A}/market/sticker-ghost.webp" alt=""><span class="price"><img src="${A}/market-hub/lesha/coin.svg" alt="">10</span></div>`}</div>`;
    const text = "отправляй в\u00a0чат или закидывай ими друзей на\u00a0карте";
    const cases = [
      ["<b>Сейчас.</b> Заголовок и описание двумя абзацами", `<div class="now"><b>стикеры</b><span>${text}</span></div>${grid()}`],
      ["<b>1.</b> Одна фраза в два веса: название белым, суть серым", `<p class="v1">стикеры <span>– отправляй в\u00a0чат или закидывай ими друзей на\u00a0карте</span></p>${grid()}`],
      ["<b>2.</b> Крупный плотный заголовок, описание узкой колонкой", `<div class="v2"><b>стикеры</b><span>${text}</span></div>${grid()}`],
      ["<b>3.</b> Журнальная пара: заголовок слева, описание справа", `<div class="v3"><b>стикеры</b><span>${text}</span></div>${grid()}`],
      ["<b>4.</b> Надзаголовок: описание капсом мелко над заголовком", `<div class="v4"><span>${text}</span><b>стикеры</b></div>${grid()}`],
      ["<b>5.</b> Заголовок курсивом, как цены в ячейках", `<div class="v5"><b>стикеры</b><span>отправляй в\u00a0чат и\u00a0закидывай друзей</span></div>${grid()}`],
    ];
    document.querySelector(".hv").insertAdjacentHTML("beforeend", cases.map(([label, body]) =>
      `<section><p class="hv__label">${label}</p><div class="hv__screen">${body}</div></section>`).join(""));
  </script>
</body>
</html>
