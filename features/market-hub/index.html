<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- прототип на GitHub Pages не индексируется: страницы не для поиска -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Blink – маркет: общий хаб</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/icons.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/screens/market.css">
  <!-- карточка, ценник, хвост на пине и шторка предмета – из маркета недели -->
  <link rel="stylesheet" href="../market-week/market-week.css">
  <link rel="stylesheet" href="market-hub.css">
</head>
<body>
<div class="stage">

  <!-- Стенд: подписи и пульт – только для показа, в продукт не идут -->
  <header class="stage__head">
    <h1 class="stage__title">маркет: общий хаб</h1>
    <p class="stage__lead">все товары одной лентой, категории сверху фильтруют её</p>
  </header>

  <div class="stage__phones mh-phones" id="stage-phones">
    <section class="stage__side" aria-labelledby="side-market">
      <h2 class="stage__caption caps-label" id="side-market">ты · маркет</h2>
      <div class="device">
        <main class="app" id="app-market" aria-label="телефон: маркет">
          <div class="status-bar" aria-hidden="true">
            <img class="status-bar__time" src="../../assets/system/status-time.png" alt="">
            <img class="status-bar__island" src="../../assets/system/live-activity.png" alt="">
            <img class="status-bar__icons" src="../../assets/system/status-icons.png" alt="">
          </div>

          <section class="screen market" id="screen-market" aria-label="маркет">
            <canvas class="market__sky" aria-hidden="true"></canvas>
            <div class="screen__scroll" id="market-scroll">
              <div class="market__content mw-feed mh-feed" id="feed">
                <div class="market__glow" aria-hidden="true"><img class="market__ring" src="../../assets/market/ring.webp" alt=""></div>
                <header class="market__header">
                  <h1 class="screen-title">маркет</h1>
                  <div class="coin-balance">
                    <img class="coin-balance__coin" src="../../assets/market/coin.png" alt="">
                    <span class="coin-balance__value" data-coins></span>
                    <button class="coin-balance__add pressable" type="button" aria-label="пополнить монеты">
                      <i class="icon icon--plus" aria-hidden="true"></i>
                    </button>
                  </div>
                </header>
                <div class="mh-vip-slot" id="vip"></div>
                <nav class="mh-cats" id="cats" aria-label="категории"></nav>
                <div id="list"></div>
              </div>
            </div>
          </section>

          <!-- экран раздела: «ещё» у блока и плитка в ленте по разделам, въезжает справа -->
          <section class="screen screen--push market mh-catscreen" id="screen-cat" aria-labelledby="cat-title" hidden>
            <div class="screen__scroll" id="cat-scroll">
              <header class="mw-all__head">
                <button class="icon-button icon-button--header pressable" type="button" data-act="back" aria-label="назад">
                  <i class="icon icon--back" aria-hidden="true"></i>
                </button>
                <h1 class="screen-title" id="cat-title"></h1>
              </header>
              <div class="mw-feed mh-feed mh-catscreen__list" id="cat-list"></div>
            </div>
          </section>

          <nav class="tabbar" aria-label="разделы">
            <button class="tabbar__item pressable" type="button"><i class="icon icon--pin" aria-hidden="true"></i>карта</button>
            <button class="tabbar__item pressable" type="button"><i class="icon icon--friends" aria-hidden="true"></i>друзья</button>
            <button class="tabbar__item pressable" type="button"><i class="icon icon--chat" aria-hidden="true"></i>чаты</button>
            <button class="tabbar__item pressable" type="button" aria-current="page"><i class="icon icon--market" aria-hidden="true"></i>маркет</button>
            <button class="tabbar__item pressable" type="button"><img class="tabbar__avatar" src="../../assets/people/me-cutout.webp" alt="">ты</button>
          </nav>

          <div class="home-indicator" aria-hidden="true"></div>
        </main>
      </div>
    </section>

    <aside class="panel" aria-label="пульт показа">
      <div class="panel__group" role="radiogroup" aria-labelledby="panel-cat">
        <p class="panel__label caps-label" id="panel-cat">категория</p>
        <div id="panel-cats" class="panel__group"></div>
      </div>
      <div class="panel__group" role="radiogroup" aria-labelledby="panel-feed-title">
        <p class="panel__label caps-label" id="panel-feed-title">лента</p>
        <div id="panel-feed" class="panel__row"></div>
      </div>
      <div class="panel__group" role="radiogroup" aria-labelledby="panel-layout-title">
        <p class="panel__label caps-label" id="panel-layout-title">товары</p>
        <div id="panel-layout" class="panel__group"></div>
      </div>
      <div class="panel__group" role="radiogroup" aria-labelledby="panel-top-title">
        <p class="panel__label caps-label" id="panel-top-title">верх</p>
        <div id="panel-top" class="panel__group"></div>
      </div>
      <div class="panel__group" id="panel-deal" role="radiogroup" aria-labelledby="panel-deal-title">
        <p class="panel__label caps-label" id="panel-deal-title">скидка для тебя</p>
        <div class="panel__row">
          <button class="panel__button pressable" type="button" role="radio" data-deal="on">есть</button>
          <button class="panel__button pressable" type="button" role="radio" data-deal="off">нет</button>
        </div>
        <button class="panel__button pressable" type="button" data-deal="soon">кончится через 10 секунд</button>
      </div>
      <div class="panel__group">
        <p class="panel__label caps-label">ещё</p>
        <button class="panel__button pressable" type="button" data-act="reset">с начала</button>
      </div>
    </aside>
  </div>
</div>

<!-- рамки пина: край живой аватарки подрезаем на 0.4 pt, как в features/pin-styles -->
<svg class="mh-defs" aria-hidden="true" focusable="false">
  <filter id="ps-trim" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="erode" radius="0.4" result="core"/>
    <feComposite in="SourceGraphic" in2="core" operator="in"/>
  </filter>
</svg>

<script src="../../scripts/pin.js"></script>
<script src="../../scripts/particles.js"></script>
<script src="../../scripts/market.js"></script>
<script src="../pin-styles/frames.js"></script>
<script src="market-hub.js"></script>
</body>
</html>
