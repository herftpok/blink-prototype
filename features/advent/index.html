<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- прототип на GitHub Pages не индексируется: страницы не для поиска -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Blink – новый год</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/icons.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="advent.css">
  <link rel="stylesheet" href="av-cards.css">
  <link rel="stylesheet" href="av-game.css">
  <link rel="stylesheet" href="av-journey.css">
  <link rel="stylesheet" href="av-tasks.css">
  <link rel="stylesheet" href="av-machine.css">
  <link rel="stylesheet" href="av-v3.css">
</head>
<body>
<div class="stage">

  <!-- Стенд: подписи, вкладки и пульт – только для показа, в продукт не идут -->
  <header class="stage__head">
    <h1 class="stage__title">новогодний адвент</h1>
    <p class="stage__lead">14–31 декабря: каждый день факт о твоём 2026 и задание. Монетки тратятся в хваталке, билетики – в розыгрыше</p>
    <nav class="stage__tabs" aria-label="разделы стенда">
      <a class="stage__tab is-active" href="index.html" aria-current="page">прототип</a>
      <a class="stage__tab" href="algorithm.html">алгоритм хваталки</a>
      <a class="stage__tab" href="states.html">сценарии</a>
    </nav>
  </header>

  <div class="stage__phones">
    <section class="stage__side" aria-label="телефон">
      <div class="stage__phone">
        <main class="app av" id="app" data-status="light" data-home="light" data-phase="train">
          <div class="status-bar" aria-hidden="true">
            <img class="status-bar__time" src="../../assets/system/status-time.png" alt="">
            <img class="status-bar__island" src="../../assets/system/live-activity.png" alt="">
            <img class="status-bar__icons" src="../../assets/system/status-icons.png" alt="">
          </div>

          <!-- ── 1. Главная: купе, на столе хваталка и билет, ниже лента дат и два задания ── -->
          <section class="screen av-screen av-home" id="screen-home" aria-labelledby="home-title">
            <div class="screen__scroll av-home__scroll" id="home-scroll">
              <div class="ex-cabin">
                <img class="ex-home-scene" src="art/train-window.webp" alt="">
                <div class="ex-cabin__window" aria-hidden="true">
                  <div class="ex-cabin__landscape" id="landscape"><img src="art/winter-panorama.webp" alt=""><img src="art/winter-panorama.webp" alt=""><img src="art/winter-panorama.webp" alt=""></div>
                  <canvas class="av-sky" id="sky"></canvas>
                </div>
                <header class="av-bar">
                  <button class="icon-button icon-button--header av-bar__back pressable" type="button" aria-label="назад" data-act="exit">
                    <i class="icon icon--back" aria-hidden="true"></i>
                  </button>
                  <h1 class="visually-hidden" id="home-title">новый год</h1>
                  <div class="av-wallet" aria-label="баланс">
                    <button class="av-balance av-balance--tickets pressable" type="button" data-go="draw"><img class="av-balance__icon av-balance__icon--ticket" src="art/ticket.webp" alt=""><span class="av-balance__value" data-tickets>0</span></button>
                    <button class="av-balance pressable" type="button" data-go="game"><img class="av-balance__icon" src="art/coin.webp" alt=""><span class="av-balance__value" data-coins>0</span></button>
                  </div>
                </header>
                <!-- предметы на столе: входы в хваталку и розыгрыш -->
                <button class="v3-prop v3-prop--machine pressable" type="button" data-go="game" aria-label="хваталка">
                  <img class="v3-prop__img" src="art/machine-empty.webp" alt="">
                  <span class="v3-prop__toys" aria-hidden="true"><img src="renders/gift-pink.webp" alt=""><img src="renders/gift-violet.webp" alt=""><img src="renders/gift-cyan.webp" alt=""></span>
                </button>
                <button class="v3-prop v3-prop--ticket pressable" type="button" data-go="draw" aria-label="розыгрыш">
                  <img class="v3-prop__img" src="art/ticket.webp" alt="">
                </button>
              </div>
              <div class="ex-home-content">
                <section class="av-home-tasks" id="home-tasks" aria-labelledby="tasks-title">
                  <div class="v3-tasks-head"><h2 class="av-home-tasks__title" id="tasks-title">задания на сегодня</h2><button class="v3-today-chip pressable" type="button" id="to-today" data-act="to-today" hidden>к сегодня</button></div>
                  <div class="v3-strip-box">
                    <div class="v3-strip" id="home-strip" role="listbox" aria-label="дни адвента"></div>
                  </div>
                  <div id="home-task-list"></div>
                </section>
                <!-- после окончания ивента: календарь всех дней, статистику можно смотреть ещё пару недель -->
                <section class="av-home-tasks v3-after" id="home-after" aria-labelledby="after-title" hidden>
                  <h2 class="av-home-tasks__title" id="after-title">твой 2026</h2>
                  <div id="home-calendar"></div>
                </section>
              </div>
            </div>
          </section>

          <!-- ── 2. Статистика: лента дат сверху, карточка или заглушка будущего дня ── -->
          <section class="screen av-screen av-stat" id="screen-stat" aria-labelledby="stat-title" hidden>
            <canvas class="av-sky" id="stat-sky" aria-hidden="true"></canvas>
            <div class="v3-stat-top">
              <div class="v3-strip v3-strip--stat" id="stat-strip" role="listbox" aria-label="дни адвента"></div>
              <button class="icon-button av-close pressable" type="button" aria-label="закрыть" data-act="close-stat">
                <i class="icon icon--close" aria-hidden="true"></i>
              </button>
            </div>
            <div class="av-stat__card" id="stat-card"></div>
            <footer class="av-stat__footer" id="stat-footer">
              <button class="button button--primary av-stat__share pressable" type="button" id="stat-share">
                <i class="icon icon--share" aria-hidden="true"></i><span>поделиться</span>
              </button>
            </footer>
          </section>

          <!-- ── 3. Хваталка ──────────────────────────────────────────── -->
          <section class="screen av-screen av-game-screen" id="screen-game" aria-labelledby="game-title" hidden>
            <header class="av-bar av-bar--fixed">
              <button class="icon-button icon-button--header av-bar__back pressable" type="button" aria-label="назад" data-act="back">
                <i class="icon icon--back" aria-hidden="true"></i>
              </button>
              <h2 class="visually-hidden" id="game-title">хваталка</h2>
              <div class="av-wallet" aria-label="баланс">
                <button class="av-balance av-balance--tickets pressable" type="button" data-go="draw"><img class="av-balance__icon av-balance__icon--ticket" src="art/ticket.webp" alt=""><span class="av-balance__value" data-tickets>0</span></button>
                <span class="av-balance"><img class="av-balance__icon" src="art/coin.webp" alt=""><span class="av-balance__value" data-coins>0</span></span>
              </div>
            </header>
            <div class="av-game" id="game"></div>
          </section>

          <!-- ── 4. Розыгрыш за билетики ───────────────────────────────── -->
          <section class="screen av-screen av-draw" id="screen-draw" aria-labelledby="draw-title" hidden>
            <div class="screen__scroll av-draw__scroll">
              <header class="av-bar">
                <button class="icon-button icon-button--header av-bar__back pressable" type="button" aria-label="назад" data-act="back">
                  <i class="icon icon--back" aria-hidden="true"></i>
                </button>
                <h2 class="av-bar__title" id="draw-title">розыгрыш</h2>
                <span class="av-balance av-balance--tickets">
                  <img class="av-balance__icon av-balance__icon--ticket" src="art/ticket.webp" alt="">
                  <span class="av-balance__value" data-tickets>0</span>
                </span>
              </header>
              <div class="v3-draw" id="draw"></div>
            </div>
          </section>

          <div class="scrim" id="scrim"></div>

          <!-- Шторка: как выполнить задание дня -->
          <div class="sheet av-sheet av-task-help" id="sheet-task" role="dialog" aria-modal="true" aria-labelledby="task-help-title" tabindex="-1">
            <div class="sheet__handle"><div class="sheet__grabber" aria-hidden="true"></div>
              <h2 class="sheet__title" id="task-help-title"></h2>
            </div>
            <p class="av-task-help__reward" id="task-help-reward"></p>
            <button class="button button--primary av-task-help__action pressable" type="button" data-act="close-sheet">понятно</button>
          </div>

          <!-- Шторка: призы хваталки и правила -->
          <div class="sheet av-sheet av-pool" id="sheet-pool" role="dialog" aria-modal="true" aria-labelledby="pool-title" tabindex="-1">
            <div class="sheet__handle"><div class="sheet__grabber" aria-hidden="true"></div>
              <h2 class="sheet__title av-pool__title" id="pool-title">призы хваталки</h2>
            </div>
            <div class="av-pool__body" id="pool-body"></div>
          </div>

          <!-- Шторка: итоги розыгрыша – один раз после окончания ивента -->
          <div class="sheet av-sheet v3-results" id="sheet-results" role="dialog" aria-modal="true" aria-labelledby="results-title" tabindex="-1">
            <div class="sheet__handle"><div class="sheet__grabber" aria-hidden="true"></div></div>
            <div class="v3-results__body" id="results-body"></div>
          </div>

          <!-- Шторка: поделиться карточкой -->
          <div class="sheet av-sheet av-share" id="sheet-share" role="dialog" aria-modal="true" aria-labelledby="share-title" tabindex="-1">
            <div class="sheet__handle"><div class="sheet__grabber" aria-hidden="true"></div>
              <h2 class="sheet__title" id="share-title">поделиться</h2>
            </div>
            <figure class="av-share__story" id="share-story" aria-label="превью сторис"></figure>
            <button class="button button--primary av-share__cta pressable" type="button" id="share-cta">
              <i class="icon icon--share" aria-hidden="true"></i><span id="share-cta-label">в сторис</span>
            </button>
          </div>

          <!-- Экскурсия по главной на первом входе: затемнение с окном вокруг показанного элемента и подпись -->
          <div class="v3-tour" id="tour" role="dialog" aria-modal="true" aria-labelledby="tour-title" hidden>
            <div class="v3-tour__hole" id="tour-hole" aria-hidden="true"></div>
            <div class="v3-tour__tip" id="tour-tip">
              <h2 class="v3-tour__title" id="tour-title"></h2>
              <p class="v3-tour__text" id="tour-text"></p>
              <div class="v3-tour__foot">
                <div class="v3-tour__dots" id="tour-dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
                <button class="v3-tour__skip pressable" type="button" data-act="tour-skip">пропустить</button>
                <button class="button button--primary v3-tour__next pressable" type="button" id="tour-next" data-act="tour-next">дальше</button>
              </div>
            </div>
          </div>

          <div class="av-fly" id="fly" aria-hidden="true"></div>
          <canvas class="av-fx" id="fx" aria-hidden="true"></canvas>
          <p class="visually-hidden" id="announce" aria-live="polite"></p>
          <div class="home-indicator" aria-hidden="true"></div>
        </main>
      </div>
    </section>

    <!-- Пульт: любой день и любое состояние одной кнопкой -->
    <aside class="panel" aria-label="пульт показа">
      <div class="panel__group" role="group" aria-labelledby="panel-today">
        <p class="panel__label caps-label" id="panel-today">сегодня</p>
        <div class="panel__row">
          <button class="panel__button pressable" type="button" data-panel="prev" aria-label="день назад">‹</button>
          <span class="panel__value" id="panel-date"></span>
          <button class="panel__button pressable" type="button" data-panel="next" aria-label="день вперёд">›</button>
        </div>
        <div class="panel__row">
          <button class="panel__button pressable" type="button" data-panel-date="14.12">14.12</button>
          <button class="panel__button pressable" type="button" data-panel-date="22.12">22.12</button>
          <button class="panel__button pressable" type="button" data-panel-date="31.12">31.12</button>
        </div>
      </div>

      <div class="panel__group" role="group" aria-labelledby="panel-user">
        <p class="panel__label caps-label" id="panel-user">человек</p>
        <button class="panel__button pressable" type="button" data-panel="tour">показать экскурсию</button>
        <button class="panel__button pressable" type="button" role="switch" aria-checked="false" data-toggle="empty">мало данных – запасные карточки</button>
        <button class="panel__button pressable" type="button" role="switch" aria-checked="false" data-toggle="vip">есть blink vip</button>
      </div>

      <div class="panel__group" role="group" aria-labelledby="panel-tasks">
        <p class="panel__label caps-label" id="panel-tasks">события</p>
        <button class="panel__button pressable" type="button" data-panel="task-done">задание выбранного дня выполнено</button>
        <div class="panel__row">
          <button class="panel__button pressable" type="button" data-panel="coins">+100 монеток</button>
          <button class="panel__button pressable" type="button" data-panel="zero">0 монеток</button>
        </div>
        <button class="panel__button pressable" type="button" data-panel="tickets">+500 билетиков</button>
      </div>

      <button class="panel__button pressable" type="button" data-panel="reset">с начала</button>
    </aside>
  </div>
</div>

<script src="../../scripts/particles.js"></script>
<script src="../../scripts/pin.js"></script>
<script src="av-data.js"></script>
<script src="av-cards.js"></script>
<script src="av-claw-engine.js"></script>
<script src="advent.js"></script>
</body>
</html>
